[tox]
isolated_build = True
envlist =
  py{311,312,313,314}-{core,django5,flask3,quart,fastapi,starlette,starlette1,rq2}
  py{312,313,314}-django6
  py{311,312,313,314}-celery
  py{311,312}-{django4,flask2,rq}

[testenv]
passenv =
  REDIS_PORT
  RABBITMQ_PORT
deps =
  pytest~=9.0
  pytest-cov~=7.0
  pytest-mock~=3.0
  pytest-asyncio~=1.0
  freezegun~=1.0
  mocket~=3.14
  httpx<1

[testenv:py{311,312,313,314}-core]
commands =
  pytest --cov=hirefire_resource --cov-report=term --cov-report=html --ignore=tests/hirefire_resource/middleware --ignore=tests/hirefire_resource/macro tests/hirefire_resource

[testenv:py{311,312}-django4]
deps =
  {[testenv]deps}
  django~=4.0
  pytest-django~=4.0
commands =
  pytest --cov=hirefire_resource --cov-report=term --cov-report=html tests/hirefire_resource/middleware/test_wsgi_django.py
  pytest --cov=hirefire_resource --cov-append --cov-report=term --cov-report=html tests/hirefire_resource/middleware/test_asgi_django.py

[testenv:py{311,312,313,314}-django5]
deps =
  {[testenv]deps}
  django~=5.0
  pytest-django~=4.0
commands =
  pytest --cov=hirefire_resource --cov-report=term --cov-report=html tests/hirefire_resource/middleware/test_wsgi_django.py
  pytest --cov=hirefire_resource --cov-append --cov-report=term --cov-report=html tests/hirefire_resource/middleware/test_asgi_django.py

[testenv:py{312,313,314}-django6]
deps =
