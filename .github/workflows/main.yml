name: Main

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install
    - name: Run check
      run: poetry run paver check
    - name: Run build
      run: poetry build

  envs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: List tox environments
      id: list
      run: echo "envs=$(pip install tox >/dev/null && tox -l | jq -R -c -s 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  test:
    needs: envs
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:latest
        ports:
          - 5672:5672
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.envs.outputs.envs) }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Derive Python version from environment
      id: python
      run: echo "version=$(echo '${{ matrix.env }}' | sed -E 's/^py([0-9])([0-9]+)-.*/\1.\2/')" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Set up Python ${{ steps.python.outputs.version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.python.outputs.version }}
    - name: Install tox
      run: pip install tox
    - name: Run ${{ matrix.env }}
      run: tox -e ${{ matrix.env }}

  publish:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install
      - name: Run build
        run: poetry build
      - name: Publish Package
        uses: pypa/gh-action-pypi-publish@release/v1
