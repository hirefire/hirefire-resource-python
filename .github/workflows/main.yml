name: Main

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: List matrix cells
        id: list
        run: echo "list=$(pip install 'tox>=4,<5' >/dev/null && tox -l | jq -R -c -s 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install
      - name: Run check
        run: poetry run paver check
      - name: Run build
        run: poetry build
      - name: Verify package artifacts
        run: bin/verify-package

  validate:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.matrix.outputs.list) }}
    name: ${{ matrix.env }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Derive Python version from environment
        id: python
        run: echo "version=$(echo '${{ matrix.env }}' | sed -E 's/^py([0-9])([0-9]+)-.*/\1.\2/')" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Set up Python ${{ steps.python.outputs.version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.python.outputs.version }}
      - name: Install tox
        run: pip install 'tox>=4,<5'
      - name: Run tests
        run: tox -e ${{ matrix.env }}

  publish:
    needs: [check, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
      - name: Verify tag is on master
        run: |
          git fetch --depth=1 origin master
          tagged="$(git rev-parse HEAD)"
          master="$(git rev-parse origin/master)"
          if [ "$tagged" != "$master" ]; then
            echo "Tag must point at origin/master ($master), got $tagged"
            exit 1
          fi
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(poetry version -s)"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match package version $expected"
            exit 1
          fi
      - name: Verify changelog has a section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! grep -qE "^## \[${version}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a section: ## [${version}] - YYYY-MM-DD"
            exit 1
          fi
      - name: Run build
        run: poetry build
      - name: Verify package artifacts
        run: bin/verify-package
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.14.2
