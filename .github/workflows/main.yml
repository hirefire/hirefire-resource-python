name: Main

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. Publish adds id-token for OIDC registry auth.
permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: List matrix cells
        id: list
        run: echo "list=$(pip install tox >/dev/null && tox -l | jq -R -c -s 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install
      - name: Run check
        run: poetry run paver check
      - name: Run build
        run: poetry build

  validate:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.matrix.outputs.list) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Derive Python version from environment
        id: python
        run: echo "version=$(echo '${{ matrix.env }}' | sed -E 's/^py([0-9])([0-9]+)-.*/\1.\2/')" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Set up Python ${{ steps.python.outputs.version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.python.outputs.version }}
      - name: Install tox
        run: pip install tox
      - name: Run tests
        run: tox -e ${{ matrix.env }}

  publish:
    needs: [check, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Bind OIDC to this environment. Create "release" in each repo Settings → Environments
    # and set the same name on the registry trusted publisher.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(poetry version -s)"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match package version $expected"
            exit 1
          fi
      - name: Verify changelog has a section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! grep -qE "^## \[${version}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a section: ## [${version}] - YYYY-MM-DD"
            exit 1
          fi
      - name: Run build
        run: poetry build
      - name: Verify package artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          def has_suffix(names, suffix):
              return any(n.endswith(suffix) for n in names)

          def has_name(names, name):
              return any(n.split("/")[-1] == name for n in names)

          sdists = list(Path("dist").glob("*.tar.gz"))
          assert sdists, "no sdist in dist/"
          with tarfile.open(sdists[0], "r:gz") as tf:
              sdist_names = tf.getnames()
          assert has_name(sdist_names, "CHANGELOG.md"), sdist_names
          assert has_name(sdist_names, "LICENSE"), sdist_names
          assert has_name(sdist_names, "README.md"), sdist_names
          assert has_suffix(sdist_names, "hirefire_resource/py.typed"), sdist_names
          print("sdist ok:", sdists[0].name)

          wheels = list(Path("dist").glob("*.whl"))
          assert wheels, "no wheel in dist/"
          with zipfile.ZipFile(wheels[0]) as zf:
              wheel_names = zf.namelist()
          assert has_suffix(wheel_names, "hirefire_resource/py.typed"), wheel_names
          assert has_name(wheel_names, "CHANGELOG.md"), wheel_names
          assert has_name(wheel_names, "LICENSE") or any(
              "LICENSE" in n for n in wheel_names
          ), wheel_names
          print("wheel ok:", wheels[0].name)
          PY
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.14.1
