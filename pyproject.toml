[project]
name = "hirefire-resource"
version = "2.0.0"
description = "Integrates Python applications with HireFire autoscalers by pushing app metrics."
authors = [
    { name = "Michael van Rooijen", email = "support@hirefire.io" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = [
    "hirefire",
    "heroku",
    "autoscale",
    "autoscaling",
    "autoscaler",
    "web",
    "worker",
    "dyno",
]
dynamic = ["classifiers"]

[project.urls]
Homepage = "https://hirefire.io"
Repository = "https://github.com/hirefire/hirefire-resource-python"
Documentation = "https://github.com/hirefire/hirefire-resource-python#readme"
"Bug Tracker" = "https://github.com/hirefire/hirefire-resource-python/issues"
Changelog = "https://github.com/hirefire/hirefire-resource-python/blob/master/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "hirefire_resource" }]
include = [
    { path = "README.md", format = ["sdist", "wheel"] },
    { path = "CHANGELOG.md", format = ["sdist", "wheel"] },
    { path = "LICENSE", format = ["sdist", "wheel"] },
    { path = "hirefire_resource/py.typed", format = ["sdist", "wheel"] },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
# Upper bound is for lock resolution only. Package metadata uses requires-python above.
python = ">=3.11,<4.0"

[tool.poetry.group.dev.dependencies]
paver = "^1.3.4"
autoflake = "^2.1.1"
isort = "^5.12.0"
black = "^23.3.0"
tox = "^3.25.0"
pytest-watch = "^4.2.0"
pytest-asyncio = "^1.0.0"
pytest-cov = "^7.0.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core>=2.2.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
files = ["hirefire_resource"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

# The queue macros import job backends (redis, celery, kombu, amqp, dateutil) that
# are optional integrations, not base dependencies, so they are absent in the
# type-check environment (and the per-cell test matrix installs only one at a time).
# Treat them as untyped rather than requiring every backend to be installed to type
# check. This is the Python analog of Node's optional-peer-dependency handling.
[[tool.mypy.overrides]]
module = [
    "redis.*",
    "celery.*",
    "kombu.*",
    "amqp.*",
    "dateutil.*",
    "dramatiq.*",
    "pika.*",
]
ignore_missing_imports = true
