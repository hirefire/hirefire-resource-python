[project]
name = "hirefire-resource"
version = "2.0.0"
description = "Application metric collection for HireFire autoscalers"
authors = [
    { name = "Michael van Rooijen", email = "support@hirefire.io" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = [
    "hirefire",
    "heroku",
    "autoscale",
    "autoscaling",
    "autoscaler",
    "web",
    "worker",
    "dyno",
]
dynamic = ["classifiers"]

[project.urls]
Homepage = "https://hirefire.io"
Repository = "https://github.com/hirefire/hirefire-resource-python"
Documentation = "https://github.com/hirefire/hirefire-resource-python#readme"
"Bug Tracker" = "https://github.com/hirefire/hirefire-resource-python/issues"
Changelog = "https://github.com/hirefire/hirefire-resource-python/blob/master/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "hirefire_resource" }]
include = [
    { path = "README.md", format = ["sdist", "wheel"] },
    { path = "CHANGELOG.md", format = ["sdist", "wheel"] },
    { path = "LICENSE", format = ["sdist", "wheel"] },
    { path = "hirefire_resource/py.typed", format = ["sdist", "wheel"] },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

[tool.poetry.group.dev.dependencies]
paver = "^1.3.4"
ruff = "^0.12.0"
tox = "^4"
pytest-asyncio = "^1.0.0"
pytest-cov = "^7.0.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core>=2.2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
files = ["hirefire_resource"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "celery.*",
    "kombu.*",
    "amqp.*",
    "dateutil.*",
    "dramatiq.*",
    "pika.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]

[tool.ruff.lint.isort]
known-first-party = ["hirefire_resource"]
